                    <line x1="0" y1="-65" x2="0" y2="65"/>
                    <line x1="60" y1="-65" x2="60" y2="65"/>
                    <line x1="120" y1="-65" x2="120" y2="65"/>
                </g>
                <rect x="-160" y="65" width="320" height="32" rx="4" fill="#0F172A" stroke="#0891B2" stroke-width="1.5"/>
