                    <circle cx="0" cy="-18" r="7" fill="#67E8F9"/>
                    <line x1="0" y1="30" x2="0" y2="65" stroke="#94A3B8" stroke-width="3"/>
                </g>
            </g>
        

  <!-- BOTTOM CARD: Main Title, Subtitle, &amp; Forensic Specs -->
