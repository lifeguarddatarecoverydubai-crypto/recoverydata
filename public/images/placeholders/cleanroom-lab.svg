    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.4"/>
      <stop offset="50%" stop-color="#1E293B" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#06B6D4" stop-opacity="0.4"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bgGrad)"/>
  <rect width="1200" height="630" fill="url(#grid)" opacity="0.85"/>
  <rect width="1200" height="630" fill="url(#centerGlow)"/>

  <rect x="18" y="18" width="1164" height="594" rx="20" fill="none" stroke="url(#borderGrad)" stroke-width="2"/>
  <rect x="24" y="24" width="1152" height="582" rx="16" fill="none" stroke="#0F172A" stroke-width="1"/>

  <!-- TOP BAR: Brand Header &amp; Category Pill -->
