      </g>
      <g transform="translate(240, 0)">
        <circle cx="6" cy="6" r="4" fill="#38BDF8"/>
        <text x="16" y="10" font-size="12" font-weight="700" fill="#CBD5E1">Non-Destructive Forensics</text>
      </g>
      <g transform="translate(460, 0)">
        <circle cx="6" cy="6" r="4" fill="#A855F7"/>
        <text x="16" y="10" font-size="12" font-weight="700" fill="#CBD5E1">24/7 Priority Emergency</text>
      </g>
      <g transform="translate(700, 0)">
        <text x="0" y="10" font-size="12" font-weight="700" fill="#38BDF8">Al Barsha 1, Dubai &#8226; +971 56 410 1040</text>
      </g>
    </g>
